name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, types and unit tests. No services -- runs in a couple of seconds.
  unit:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src

      - name: Unit tests
        run: pytest -m "not integration" -q

  # Integration tests and a real end-to-end load against a throwaway Postgres.
  # The tests TRUNCATE core.* and raw.* (see REMAINING.md section 4.4), which is
  # safe here because this database exists only for the length of the job.
  integration:
    name: integration + full load
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aker
          POSTGRES_USER: aker
          POSTGRES_PASSWORD: aker_ci
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U aker -d aker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_DB: aker
      POSTGRES_USER: aker
      POSTGRES_PASSWORD: aker_ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5434"
      AKER_DATA_DIR: ./Aker Case Study Data
      AKER_LOG_LEVEL: INFO
      # The insight layer needs Ollama, which is not available on a runner.
      AKER_INSIGHT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Apply schema
        run: aker-etl init-db

      - name: Integration tests
        run: pytest -m integration -q

      - name: Full load
        run: aker-etl load --force

      - name: Golden numbers
        run: aker-etl status

      # `validate --strict` exits 2 on the one expected 153c warning
      # (REMAINING.md section 4.1), so it cannot gate the build until that
      # discrepancy is settled with the client. Recorded, not enforced.
      - name: Validate (non-blocking)
        continue-on-error: true
        run: aker-etl validate --strict
